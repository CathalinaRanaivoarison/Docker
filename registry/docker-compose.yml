services:
  registry:
    image: registry:2
    container_name: registry
    ports:
      - "5002:5000"
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - registry_network
    restart: unless-stopped

  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui
    ports:
      - "8090:80"
    environment:
      - REGISTRY_TITLE=POZOS Private Registry
      - NGINX_PROXY_PASS_URL=http://registry:5000
      - SINGLE_REGISTRY=true
      - DELETE_IMAGES=true
    depends_on:
      - registry
    networks:
      - registry_network
    restart: unless-stopped

volumes:
  registry_data:

networks:
  registry_network:
    driver: bridge
