services:
  api:
    image: student-list-api:v1
    build: ./simple_api
    container_name: api
    volumes:
      - ./simple_api/student_age.json:/data/student_age.json
    ports:
      - "5001:5000"
    networks:
      - student_list_network
    restart: unless-stopped

  website:
    image: php:apache
    container_name: website
    environment:
      - USERNAME=toto
      - PASSWORD=python
    volumes:
      - ./website:/var/www/html
    depends_on:
      - api
    ports:
      - "8081:80"
    networks:
      - student_list_network
    restart: unless-stopped

networks:
  student_list_network:
    driver: bridge